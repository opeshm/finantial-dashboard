<div>
  <app-page-breadcrumb pageTitle="Simulador de interes compuesto" />

  <div class="mb-6 flex flex-wrap items-center justify-end gap-3">
    <button
      type="button"
      (click)="openConfigModal()"
      class="inline-flex items-center gap-2 rounded-xl bg-brand-500 px-4 py-3 text-sm font-medium text-white shadow-theme-xs transition hover:bg-brand-600"
    >
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 3V15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 9H15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Configuraciones
    </button>
  </div>

  <div class="space-y-6">
    <div class="grid grid-cols-1 gap-6 xl:grid-cols-12">
      <div class="space-y-6 xl:col-span-4">
        <app-base-assumptions-card
          [initialCapital]="initialCapital"
          [annualGrowthRate]="annualGrowthRate"
          [simulationYears]="simulationYears"
          (initialCapitalChange)="updateInitialCapital($event)"
          (annualGrowthRateChange)="updateAnnualGrowthRate($event)"
          (simulationYearsChange)="updateSimulationYears($event)"
        />

        <app-dca-overview-card
          [totalRanges]="dcaRanges.length"
          (configure)="openDcaModal()"
        />
      </div>

      <div class="space-y-6 xl:col-span-8">
        <app-summary-metrics
          [summary]="summary"
          [simulationYears]="simulationYears"
        />

        <div>
          <app-component-card
            title="Evolucion del patrimonio"
            desc="Comparativa entre capital total, dinero aportado y beneficios acumulados."
          >
            <apx-chart
              [series]="evolutionSeries"
              [chart]="evolutionChart"
              [colors]="evolutionColors"
              [stroke]="evolutionStroke"
              [fill]="evolutionFill"
              [markers]="evolutionMarkers"
              [grid]="evolutionGrid"
              [dataLabels]="evolutionDataLabels"
              [tooltip]="evolutionTooltip"
              [xaxis]="evolutionXaxis"
              [yaxis]="evolutionYaxis"
              [legend]="evolutionLegend"
            ></apx-chart>
          </app-component-card>
        </div>
      </div>
    </div>

    <app-extra-contributions-card
      [extraContributions]="extraContributions"
      (configure)="openExtraContributionsModal()"
    />

    <div class="grid grid-cols-1 gap-6 xl:grid-cols-2">
      <app-component-card
        title="Composicion final"
        desc="Peso relativo del capital inicial, las aportaciones y los intereses."
      >
        <apx-chart
          [series]="compositionSeries"
          [chart]="compositionChart"
          [colors]="compositionColors"
          [labels]="compositionLabels"
          [legend]="compositionLegend"
          [plotOptions]="compositionPlotOptions"
          [dataLabels]="compositionDataLabels"
          [stroke]="compositionStroke"
          [tooltip]="compositionTooltip"
          [responsive]="compositionResponsive"
        ></apx-chart>
      </app-component-card>

      <app-insights-card
        [summary]="summary"
        [annualGrowthRate]="annualGrowthRate"
      />
    </div>

    <app-yearly-projection-table [yearlyProjection]="yearlyProjection" />
  </div>

  <app-dca-config-modal
    [isOpen]="isDcaModalOpen"
    [dcaDraft]="dcaDraft"
    [dcaRanges]="dcaRanges"
    [frequencyOptions]="frequencyOptions"
    (close)="closeDcaModal()"
    (save)="saveDcaRange()"
    (changed)="recalculate()"
    (removeRange)="removeDcaRange($event)"
  />

  <app-configurations-modal
    [isOpen]="isConfigModalOpen"
    [configName]="configName"
    [configSearch]="configSearch"
    [configFeedback]="configFeedback"
    [configFeedbackType]="configFeedbackType"
    [filteredSavedConfigs]="filteredSavedConfigs"
    (close)="closeConfigModal()"
    (configNameChange)="configName = $event"
    (configSearchChange)="configSearch = $event"
    (saveCurrent)="saveCurrentConfiguration()"
    (exportCurrent)="exportCurrentConfiguration()"
    (exportAll)="exportAllSavedConfigurations()"
    (importFile)="handleImportFile($event)"
    (loadConfiguration)="loadConfiguration($event)"
    (exportConfiguration)="exportSavedConfiguration($event)"
    (deleteConfiguration)="deleteConfiguration($event)"
  />

  <app-extra-contributions-modal
    [isOpen]="isExtraContributionsModalOpen"
    [extraContributions]="extraContributions"
    [monthOptions]="monthOptions"
    (close)="closeExtraContributionsModal()"
    (changed)="recalculate()"
    (addContribution)="addExtraContribution()"
    (removeContribution)="removeExtraContribution($event)"
  />
</div>
