<app-modal
  [isOpen]="isOpen"
  (close)="close.emit()"
  className="relative m-4 w-full max-w-[1100px] rounded-3xl bg-white p-6 dark:bg-gray-900 lg:p-8"
>
  <div class="space-y-6">
    <div class="flex flex-wrap items-start justify-between gap-4 pr-10">
      <div>
        <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Configuración de tramos DCA</h3>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
          Gestiona todos los tramos desde una tabla editable y añade nuevos periodos cuando lo necesites.
        </p>
      </div>

      <button
        type="button"
        (click)="save.emit()"
        class="inline-flex items-center rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white hover:bg-brand-600"
      >
        Añadir tramo
      </button>
    </div>

    <div class="rounded-2xl border border-gray-200 bg-gray-50 p-5 dark:border-gray-800 dark:bg-white/[0.03]">
      <div class="grid grid-cols-1 gap-4 xl:grid-cols-[minmax(0,1.4fr)_110px_110px_140px_160px_auto]">
        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300">Nombre del tramo</label>
          <input
            type="text"
            [(ngModel)]="dcaDraft.label"
            name="dcaDraftLabel"
            placeholder="Ej. Aceleración profesional"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300">Desde</label>
          <input
            type="number"
            min="1"
            [(ngModel)]="dcaDraft.startYear"
            name="dcaDraftStartYear"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300">Hasta</label>
          <input
            type="number"
            min="1"
            [(ngModel)]="dcaDraft.endYear"
            name="dcaDraftEndYear"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300">Aportación</label>
          <input
            type="number"
            min="0"
            [(ngModel)]="dcaDraft.amount"
            name="dcaDraftAmount"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300">Frecuencia</label>
          <select
            [(ngModel)]="dcaDraft.frequency"
            name="dcaDraftFrequency"
            class="h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
          >
            @for (option of frequencyOptions; track option.value) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
        </div>

        <div class="flex items-end">
          <button
            type="button"
            (click)="save.emit()"
            class="inline-flex h-11 w-full items-center justify-center rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white hover:bg-brand-600"
          >
            Añadir
          </button>
        </div>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-800">
        <thead>
          <tr>
            <th class="px-3 py-3 text-left text-xs font-medium uppercase tracking-wide text-gray-500">Tramo</th>
            <th class="px-3 py-3 text-left text-xs font-medium uppercase tracking-wide text-gray-500">Desde</th>
            <th class="px-3 py-3 text-left text-xs font-medium uppercase tracking-wide text-gray-500">Hasta</th>
            <th class="px-3 py-3 text-left text-xs font-medium uppercase tracking-wide text-gray-500">Aportación</th>
            <th class="px-3 py-3 text-left text-xs font-medium uppercase tracking-wide text-gray-500">Frecuencia</th>
            <th class="px-3 py-3 text-right text-xs font-medium uppercase tracking-wide text-gray-500">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
          @for (range of dcaRanges; track range.id) {
            <tr class="align-top hover:bg-gray-50 dark:hover:bg-white/[0.02]">
              <td class="px-3 py-3">
                <input
                  type="text"
                  [(ngModel)]="range.label"
                  name="rangeLabel{{ range.id }}"
                  (ngModelChange)="changed.emit()"
                  class="h-10 w-[180px] min-w-[180px] rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
                />
              </td>
              <td class="px-3 py-3">
                <input
                  type="number"
                  min="1"
                  [(ngModel)]="range.startYear"
                  name="rangeStart{{ range.id }}"
                  (ngModelChange)="changed.emit()"
                  class="h-10 w-24 rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
                />
              </td>
              <td class="px-3 py-3">
                <input
                  type="number"
                  min="1"
                  [(ngModel)]="range.endYear"
                  name="rangeEnd{{ range.id }}"
                  (ngModelChange)="changed.emit()"
                  class="h-10 w-24 rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
                />
              </td>
              <td class="px-3 py-3">
                <input
                  type="number"
                  min="0"
                  [(ngModel)]="range.amount"
                  name="rangeAmount{{ range.id }}"
                  (ngModelChange)="changed.emit()"
                  class="h-10 w-32 rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
                />
              </td>
              <td class="px-3 py-3">
                <select
                  [(ngModel)]="range.frequency"
                  name="rangeFrequency{{ range.id }}"
                  (ngModelChange)="changed.emit()"
                  class="h-10 w-36 appearance-none rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
                >
                  @for (option of frequencyOptions; track option.value) {
                    <option [value]="option.value">{{ option.label }}</option>
                  }
                </select>
              </td>
              <td class="px-3 py-3 text-right">
                <button
                  type="button"
                  (click)="removeRange.emit(range.id)"
                  class="inline-flex items-center rounded-lg border border-gray-300 px-3 py-2 text-xs font-medium text-gray-600 hover:bg-gray-100 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-800"
                >
                  Eliminar
                </button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="6" class="px-4 py-10 text-center text-sm text-gray-500 dark:text-gray-400">
                No hay tramos definidos. Añade el primero desde la fila superior.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="flex items-center justify-end gap-3">
      <button
        type="button"
        (click)="close.emit()"
        class="inline-flex items-center rounded-lg border border-gray-300 px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-100 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-800"
      >
        Cerrar
      </button>
    </div>
  </div>
</app-modal>
